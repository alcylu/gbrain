# Skip the `bun build --compile` step (fails on optional dynamic imports we don't use).
# Run gbrain directly from source via Bun.
[phases.setup]
nixPkgs = ["bun"]

[phases.install]
cmds = ["bun install --frozen-lockfile"]

[phases.build]
cmds = []

[start]
cmd = "bun run src/cli.ts serve --http --port $PORT"
